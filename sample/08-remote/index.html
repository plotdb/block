<div>
  <div class="clock-face">
    <span class="time">--:--:--</span>
    <span class="date"></span>
  </div>
  <style>
    .clock-face {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 28px;
      background: #1a1a2e;
      color: #e0e0e0;
      border-radius: 12px;
      font-family: 'Courier New', monospace;
    }
    .time {
      font-size: 2.2rem;
      font-weight: bold;
      letter-spacing: 4px;
      color: #00d4ff;
    }
    .date { font-size: 0.85rem; color: #888; margin-top: 4px; }
  </style>
  <script type="@plotdb/block">
    module.exports = {
      pkg: { name: 'clock', version: 'main' },
      init: function(opt) {
        var timeEl = opt.root.querySelector('.time');
        var dateEl = opt.root.querySelector('.date');
        function update() {
          var now = new Date();
          var pad = function(n) { return String(n).padStart(2, '0'); };
          timeEl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
          dateEl.textContent = now.toDateString();
        }
        update();
        this.timer = setInterval(update, 1000);
      },
      destroy: function() {
        clearInterval(this.timer);
      }
    };
  </script>
</div>
