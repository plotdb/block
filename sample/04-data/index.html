<div class="card">
  <div class="avatar"></div>
  <h4 class="name"></h4>
  <div class="role"></div>
  <p class="bio"></p>
  <style>
    .card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      font-family: sans-serif;
      background: #fff;
    }
    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #eaf0f6;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }
    .name { margin: 0 0 4px; font-size: 1rem; }
    .role { color: #7f8c8d; font-size: 0.82rem; margin-bottom: 8px; }
    .bio  { color: #555; font-size: 0.88rem; line-height: 1.5; margin: 0; }
  </style>
  <script type="@plotdb/block">
    module.exports = {
      pkg: { name: 'profile-card', version: 'main' },
      init: function(opt) {
        var d = opt.data || {};
        opt.root.querySelector('.avatar').textContent = d.emoji  || '👤';
        opt.root.querySelector('.name').textContent   = d.name   || 'Unknown';
        opt.root.querySelector('.role').textContent   = d.role   || '';
        opt.root.querySelector('.bio').textContent    = d.bio    || '';
      }
    };
  </script>
</div>
