<div>
  <div class="display">0</div>
  <style>
    .display {
      font-size: 3rem;
      font-weight: bold;
      text-align: center;
      padding: 20px;
      background: #f0f4f8;
      border-radius: 8px;
      color: #2c3e50;
      font-family: monospace;
    }
  </style>
  <script type="@plotdb/block">
    module.exports = {
      pkg: { name: 'counter', version: 'main' },
      init: function(opt) {
        this.count = 0;
        this.display = opt.root.querySelector('.display');
      },
      interface: function() {
        var self = this;
        return {
          increment: function() { self.display.textContent = ++self.count; },
          decrement: function() { self.display.textContent = --self.count; },
          reset:     function() { self.display.textContent = self.count = 0; },
          getCount:  function() { return self.count; }
        };
      }
    };
  </script>
</div>
